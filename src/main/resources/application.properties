spring.application.name=product-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET:MySuperSecretKeyForJwtSigningDontShare}
jwt.expiration-ms=900000
jwt.refresh-window-ms=600000
jwt.max-session-ms=604800000
